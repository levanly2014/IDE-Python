<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password - Minh IDE</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { width: 320px; border: 1px solid #d3d3d3; background: #fcfcfc; padding: 20px; border-radius: 6px; }
        input[type="email"] { width: 93%; padding: 8px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #2b6095; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h3>Reset Password</h3>
        <p style="font-size: 13px; color: #555;">Enter your account email to receive a password reset link.</p>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Send Email</button>
        </form>
    </div>
</body>
</html>
